version: '3.8'

services:
  # Backend API server
  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    container_name: radcod-backend
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - RADCODE_WORKSPACES=/workspace
      - RADCODE_SECURITY=medium
      - RADCODE_TIMEOUT=600
      - LLM_MODEL=${LLM_MODEL:-anthropic/claude-sonnet-4-5-20250929}
      - LLM_API_KEY=${LLM_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - radcod_workspace:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - radcod-network

  # Frontend UI server
  frontend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.frontend
    container_name: radcod-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - radcod-network

networks:
  radcod-network:
    driver: bridge

volumes:
  radcod_workspace:
    driver: local