[project]
name = "radcod"
version = "0.1.0"
description = "AI Software Engineer - Devin-like autonomous agent"
dependencies = [
    "openhands-sdk>=1.17.0",
    "openhands-tools>=1.17.0",
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "sse-starlette>=1.6",
    "pydantic>=2.0",
    "psutil>=5.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff",
]
github = [
    "PyGithub>=1.59",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
